<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <form action="{% url 'save_edit' title %}" method="post">
        {% csrf_token %}
        <input type="text" name="title" value="{{ title }}" readonly>
        <textarea name="content">{{ body }}</textarea>
        <button type="submit">Зберегти</button>
    </form>
</body>
</html>
